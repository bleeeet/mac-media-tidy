<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>媒体整理</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div id="app">
  <header class="masthead">
    <div class="masthead-rule"><span>档案整理</span><span class="masthead-meta">MEDIA · ARCHIVE</span></div>
    <h1>媒体整理</h1>
    <p class="sub">去重 · HEIC 转 JPG · 视频压制 H.265 1080p30 · 图片瘦身至 3MB 内</p>
  </header>

  <div id="health" class="panel hidden"></div>

  <section id="step-pick" class="panel">
    <div class="step-mark"><i>01</i><span>选择文件夹</span></div>
    <div id="drop" class="drop">
      <strong>把文件夹拖到这里</strong>
      <em>扫描阶段纯只读，不会碰任何文件</em>
    </div>
    <p class="hint lede">或者直接粘贴路径（Finder 里选中文件夹按 <kbd>⌘⌥C</kbd> 复制路径）：</p>
    <div class="row">
      <input type="text" id="pathInput" placeholder="/Users/…">
      <button id="useBtn">使用</button>
      <button id="browseBtn" class="ghost">浏览</button>
    </div>
    <div id="pickMsg" class="hint msg"></div>
    <div id="browser" class="hidden">
      <div class="row browser-head">
        <strong id="browserPath"></strong>
        <button id="upBtn" class="ghost">上级</button>
        <button id="chooseBtn">选择这个文件夹</button>
      </div>
      <div id="dirlist" class="dirlist"></div>
    </div>
  </section>

  <section id="step-plan" class="panel hidden">
    <div class="step-mark"><i>02</i><span>预演清单</span></div>
    <h2 id="planTitle"></h2>
    <div class="stats" id="planStats"></div>
    <div class="options">
      <label class="toggle"><input type="checkbox" id="optDedup" checked><span>删除重复文件</span></label>
      <label class="toggle"><input type="checkbox" id="optHeic" checked><span>HEIC 转 JPG</span></label>
      <label class="toggle"><input type="checkbox" id="optImage" checked><span>压缩超过 3MB 的图片</span></label>
      <label class="toggle"><input type="checkbox" id="optVideo" checked><span>压制超标视频</span></label>
      <label class="toggle"><input type="checkbox" id="optBackup" checked><span>备份原件到「原图」文件夹</span></label>
    </div>
    <div id="backupWarn" class="warn hidden">
      不备份：被替换和去重的原件将<strong>直接删除</strong>，无法回滚。
    </div>
    <div class="row actions">
      <button id="runBtn">开始处理</button>
      <button id="backBtn" class="ghost">换个文件夹</button>
    </div>
  </section>

  <section id="step-run" class="panel hidden">
    <div class="step-mark"><i>03</i><span>处理中</span></div>
    <h2 id="phaseText">准备中…</h2>
    <div class="bar"><i id="overallBar"></i></div>
    <div id="slots"></div>
    <div class="log" id="log"></div>
  </section>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
